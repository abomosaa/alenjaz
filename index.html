<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإنجاز - ALENJAZ</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --burgundy:      #7a1a1a;
    --burgundy-dark: #5c1010;
    --gold:          #c9a84c;
    --gold-light:    #dfc07a;
    --white:         #ffffff;
    --text-muted:    rgba(255,255,255,0.65);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--burgundy-dark);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ══ HERO ══ */
  .hero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }

  /* Photo side */
  .hero-photo {
    position: relative;
    background: linear-gradient(160deg,#9e9d8e,#6e6d60);
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .hero-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .hero-photo::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(to left, transparent 55%, var(--burgundy-dark) 100%);
  }

  /* Content side */
  .hero-content {
    position: relative; z-index:2;
    background: linear-gradient(175deg, var(--burgundy-dark) 0%, var(--burgundy) 45%, var(--burgundy-dark) 100%);
    display: flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 3rem 2.5rem; gap: 1.8rem;
  }
  .hero-content::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* ══ LOGO ══ */
  .logo-wrap {
    display:flex; flex-direction:column; align-items:center; gap:.5rem;
    animation: fadeDown .8s ease both;
  }
  .logo-svg { width:165px; height:165px; }

  /* ══ DIVIDER ══ */
  .divider {
    width:80%; height:1px;
    background: linear-gradient(90deg, transparent, var(--gold) 50%, transparent);
    opacity:.45;
  }

  /* ══ TITLE ══ */
  .section-title { text-align:center; animation: fadeDown .8s .15s ease both; }
  .section-title h1 { font-size:2.6rem; font-weight:700; line-height:1.25; }
  .section-title h1 span { color: var(--gold); }

  /* ══ SOCIAL BAR ══ */
  .social-bar {
    display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
    animation: fadeUp .8s .3s ease both;
  }
  .soc-btn {
    width: 54px; height: 54px; border-radius: 14px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(201,168,76,.25);
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; transition: all .3s;
  }
  .soc-btn:hover {
    background: var(--gold); border-color: var(--gold);
    transform: translateY(-3px);
    box-shadow: 0 6px 18px rgba(201,168,76,.4);
  }
  .soc-btn svg { width: 24px; height: 24px; fill: var(--gold); transition: fill .3s; }
  .soc-btn:hover svg { fill: var(--burgundy-dark); }

  /* ══ CONTACT SECTION ══ */
  .contact-section {
    padding:4rem 1.5rem 3rem;
    max-width:680px; margin:0 auto;
    animation: fadeUp .8s .5s ease both;
  }
  .contact-header { text-align:center; margin-bottom:2.5rem; }
  .contact-header h2 {
    font-size:2rem; font-weight:700; color:var(--gold);
    display:inline-block; position:relative;
  }
  .contact-header h2::after {
    content:''; display:block; margin:.4rem auto 0;
    width:60%; height:2px;
    background: linear-gradient(90deg,transparent,var(--gold),transparent);
  }

  /* ══ BRANCH CARDS ══ */
  .branches { display:flex; flex-direction:column; gap:1rem; }
  .branch-card {
    background:rgba(255,255,255,.04);
    border:1px solid rgba(201,168,76,.2);
    border-radius:16px; padding:1.2rem 1.4rem;
    transition:all .3s;
  }
  .branch-card:hover {
    border-color:var(--gold); background:rgba(201,168,76,.06);
    box-shadow:0 6px 22px rgba(0,0,0,.25);
  }
  .branch-top {
    display:flex; align-items:center; gap:1rem; margin-bottom:1rem;
  }
  .bicon {
    width:46px; height:46px; border-radius:11px;
    background:var(--gold);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .bicon svg { width:22px; height:22px; fill:var(--burgundy-dark); }
  .binfo { flex:1; }
  .bname { font-size:1rem; font-weight:700; color:var(--gold-light); display:block; margin-bottom:.15rem; }
  .bnum  { font-size:.88rem; color:var(--white); direction:ltr; display:block; }
  .branch-btns { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
  .bbtn {
    display:flex; align-items:center; justify-content:center; gap:.5rem;
    padding:.65rem 1rem; border-radius:10px;
    font-family:'Tajawal',sans-serif; font-size:.88rem; font-weight:700;
    text-decoration:none; transition:all .25s;
  }
  .bbtn svg { width:18px; height:18px; flex-shrink:0; }
  .bbtn-wa  { background:rgba(37,211,102,.12); border:1px solid rgba(37,211,102,.3); color:#25d366; }
  .bbtn-wa svg { fill:#25d366; }
  .bbtn-wa:hover  { background:rgba(37,211,102,.22); border-color:#25d366; }
  .bbtn-map { background:rgba(201,168,76,.1); border:1px solid rgba(201,168,76,.3); color:var(--gold-light); }
  .bbtn-map svg { fill:var(--gold-light); }
  .bbtn-map:hover { background:rgba(201,168,76,.2); border-color:var(--gold); }

  /* ══ FOOTER ══ */
  footer {
    text-align:center; padding:2rem 1rem;
    border-top:1px solid rgba(201,168,76,.15);
    color:rgba(255,255,255,.3); font-size:.8rem;
  }
  footer span { color:var(--gold); }

  @keyframes fadeDown { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:none} }
  @keyframes fadeUp   { from{opacity:0;transform:translateY(18px)}  to{opacity:1;transform:none} }

  @media(max-width:768px){
    .hero { grid-template-columns: 1fr; }
    .hero-photo { height:300px; }
    .hero-photo::after { background:linear-gradient(to top,var(--burgundy-dark) 0%,transparent 55%); }
    .hero-content { padding:2rem 1.2rem; }
    .section-title h1 { font-size:2rem; }
  }
</style>
</head>
